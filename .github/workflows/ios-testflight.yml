name: Upload iOS to TestFlight
run-name: TestFlight ${{ inputs.version }}+${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published client version'
        required: true
        type: string
      build_number:
        description: 'Build number on the stable Release'
        required: true
        type: string
      require_signing:
        description: 'Fail if signing credentials are unavailable'
        type: boolean
        default: true

permissions:
  contents: read

env:
  FLUTTER_SWIFT_PACKAGE_MANAGER: 'false'

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    concurrency:
      group: testflight-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Resolve and verify the published source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          version, build = (os.environ[n] for n in ('RELEASE_VERSION', 'RELEASE_BUILD'))
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version)
          assert re.fullmatch(r'[1-9][0-9]*', build)
          version_tag = f'v{version}'
          build_tag = f'{version_tag}+{build}'
          ref = os.environ['GITHUB_REF']
          if ref == f'refs/tags/{version_tag}':
              source = ref
          elif ref == f'refs/tags/{build_tag}' or re.fullmatch(
              re.escape(f'refs/tags/{build_tag}-testflight') + r'(?:\.[1-9][0-9]*)?', ref
          ):
              source = f'refs/tags/{build_tag}'
          else:
              raise SystemExit('Run the upload on the published version or build tag.')
          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{repo}/releases/tags/{version_tag}',
          ]))
          assert not release['draft'] and not release['prerelease']
          assert release['name'] == f'THMR {version}+{build}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'ref={source}\n')
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false
      - name: Prepare Apple signing
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_APP_STORE_CONNECT_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_ID }}
          IOS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_ISSUER_ID }}
          IOS_APP_STORE_CONNECT_KEY_P8: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_P8 }}
        run: python3 tool/prepare_ios_signing.py
      - name: Require signing credentials for the requested upload
        if: inputs.require_signing && steps.signing.outputs.enabled != 'true'
        run: |
          echo '::error::The testflight environment did not provide signing credentials.'
          exit 1
      - uses: subosito/flutter-action@v2
        if: steps.signing.outputs.enabled == 'true'
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Install Flutter dependencies
        if: steps.signing.outputs.enabled == 'true'
        run: flutter pub get --enforce-lockfile
      - name: Archive and export the signed IPA
        if: steps.signing.outputs.enabled == 'true'
        env:
          CLIENT_VERSION: ${{ inputs.version }}
          IOS_VERSION: ${{ inputs.version }}
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_BUNDLE_ID: ${{ steps.signing.outputs.bundle_id }}
        run: bash tool/build_ios.sh --testflight
      - name: Upload the IPA to App Store Connect
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_APP_STORE_CONNECT_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_ID }}
          IOS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_ISSUER_ID }}
          IOS_APP_STORE_CONNECT_KEY_P8: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_P8 }}
        run: |
          shopt -s nullglob
          packages=("$PWD"/build/ios/ipa/*.ipa)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo '::error::Expected exactly one exported iOS IPA.'
            exit 1
          fi
          if [[ ! "$IOS_APP_STORE_CONNECT_KEY_ID" =~ ^[A-Z0-9]+$ ]]; then
            echo '::error::Invalid App Store Connect API key ID.'
            exit 1
          fi
          umask 077
          api_dir=$(mktemp -d "$RUNNER_TEMP/testflight-api.XXXXXX")
          trap 'rm -rf "$api_dir"' EXIT
          cd "$api_dir"
          mkdir private_keys
          printf '%s\n' "$IOS_APP_STORE_CONNECT_KEY_P8" > "private_keys/AuthKey_$IOS_APP_STORE_CONNECT_KEY_ID.p8"
          xcrun altool --upload-app --type ios -f "${packages[0]}" \
            --apiKey "$IOS_APP_STORE_CONNECT_KEY_ID" --apiIssuer "$IOS_APP_STORE_CONNECT_ISSUER_ID"
