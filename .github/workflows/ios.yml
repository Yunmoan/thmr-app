name: Build iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # iOS 上的 file_picker 仅用于文档导出，由 Podfile 关闭媒体和音频选择器。
  FLUTTER_SWIFT_PACKAGE_MANAGER: 'false'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Check the iOS toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version
      - name: Resolve the iOS version
        id: version
        run: python3 tool/resolve_version.py
      - run: flutter pub get --enforce-lockfile
      - name: Build the unsigned device app
        env:
          CLIENT_VERSION: ${{ steps.version.outputs.version }}
          IOS_VERSION: ${{ steps.version.outputs.ios_version }}
          IOS_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: bash tool/build_ios.sh
