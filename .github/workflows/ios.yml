name: Build iOS

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store Connect build number for v0.1.9
        required: true
        type: string

permissions:
  contents: read

jobs:
  testflight:
    if: github.ref == 'refs/heads/codex/testflight-v0.1.9'
    uses: ./.github/workflows/ios-testflight.yml
    with:
      version: '0.1.9'
      build_number: ${{ inputs.build_number }}
