name: Build iOS

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store Connect build number for v0.1.9
        required: true
        type: string

permissions:
  contents: read

env:
  FLUTTER_SWIFT_PACKAGE_MANAGER: 'false'

jobs:
  upload:
    if: github.ref == 'refs/heads/codex/testflight-v0.1.9'
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    concurrency:
      group: testflight-0.1.9
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare Apple signing
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_APP_STORE_CONNECT_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_ID }}
          IOS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_ISSUER_ID }}
          IOS_APP_STORE_CONNECT_KEY_P8: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_P8 }}
        run: python3 tool/prepare_ios_signing.py
      - name: Require signing credentials
        if: steps.signing.outputs.enabled != 'true'
        run: |
          echo '::error::The testflight environment did not provide signing credentials.'
          exit 1
      - uses: subosito/flutter-action@v2
        if: steps.signing.outputs.enabled == 'true'
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Install Flutter dependencies
        if: steps.signing.outputs.enabled == 'true'
        run: flutter pub get --enforce-lockfile
      - name: Archive and export the signed IPA
        if: steps.signing.outputs.enabled == 'true'
        env:
          CLIENT_VERSION: '0.1.9'
          IOS_VERSION: '0.1.9'
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_BUNDLE_ID: ${{ steps.signing.outputs.bundle_id }}
        run: bash tool/build_ios.sh --testflight
      - name: Upload the IPA to App Store Connect
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_APP_STORE_CONNECT_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_ID }}
          IOS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_ISSUER_ID }}
          IOS_APP_STORE_CONNECT_KEY_P8: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_P8 }}
        run: |
          shopt -s nullglob
          packages=("$PWD"/build/ios/ipa/*.ipa)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo '::error::Expected exactly one exported iOS IPA.'
            exit 1
          fi
          if [[ ! "$IOS_APP_STORE_CONNECT_KEY_ID" =~ ^[A-Z0-9]+$ ]]; then
            echo '::error::Invalid App Store Connect API key ID.'
            exit 1
          fi
          umask 077
          api_dir=$(mktemp -d "$RUNNER_TEMP/testflight-api.XXXXXX")
          trap 'rm -rf "$api_dir"' EXIT
          cd "$api_dir"
          mkdir private_keys
          printf '%s\n' "$IOS_APP_STORE_CONNECT_KEY_P8" > "private_keys/AuthKey_$IOS_APP_STORE_CONNECT_KEY_ID.p8"
          xcrun altool --upload-app --type ios -f "${packages[0]}" \
            --apiKey "$IOS_APP_STORE_CONNECT_KEY_ID" --apiIssuer "$IOS_APP_STORE_CONNECT_ISSUER_ID"
