# v* tags build every client with the tag version and publish update packages.
name: Build Clients

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Client version (optional, e.g. 0.2.0; defaults to pubspec.yaml)'
        required: false
        type: string
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'
  UPDATE_API_URL: ${{ vars.THMR_UPDATE_API_URL || 'https://api.zyghit.cn/updater/thmr' }}
  UPDATE_PUBLIC_KEY: ${{ vars.THMR_UPDATE_PUBLIC_KEY }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      macos_version: ${{ steps.version.outputs.macos_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the version for every client
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python3 tool/resolve_version.py
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: server-plugin
      - run: npm test
        working-directory: server-plugin
      - name: Require a pinned update key for official releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'if(Buffer.from(process.env.UPDATE_PUBLIC_KEY || "", "base64").length !== 32) throw new Error("Configure repository variable THMR_UPDATE_PUBLIC_KEY before tagging a release")'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  linux:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev \
            libayatana-appindicator3-dev libmpv-dev mpv
      - run: flutter pub get
      - run: >-
          flutter build linux --release
          --build-name=${{ needs.validate.outputs.version }}
          --build-number=${{ needs.validate.outputs.build_number }}
          --dart-define=THMR_CLIENT_VERSION=${{ needs.validate.outputs.version }}
          --dart-define=THMR_UPDATE_API_URL=${{ env.UPDATE_API_URL }}
          --dart-define=THMR_UPDATE_PUBLIC_KEY=${{ env.UPDATE_PUBLIC_KEY }}
      - name: Pack the complete bundle
        env:
          CLIENT_VERSION: ${{ needs.validate.outputs.version }}
          CLIENT_BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        run: |
          python3 -c 'import json, os; from pathlib import Path; v = json.loads(Path("build/linux/x64/release/bundle/data/flutter_assets/version.json").read_text()); assert v["version"] == os.environ["CLIENT_VERSION"]; assert v["build_number"] == os.environ["CLIENT_BUILD_NUMBER"]'
          tar -czf thmr-app-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: thmr-app-linux
          path: thmr-app-linux-x64.tar.gz
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build macos --release
          --build-name=${{ needs.validate.outputs.macos_version }}
          --build-number=${{ needs.validate.outputs.build_number }}
          --dart-define=THMR_CLIENT_VERSION=${{ needs.validate.outputs.version }}
          --dart-define=THMR_UPDATE_API_URL=${{ env.UPDATE_API_URL }}
          --dart-define=THMR_UPDATE_PUBLIC_KEY=${{ env.UPDATE_PUBLIC_KEY }}
      - name: Verify and package the universal app
        env:
          CLIENT_VERSION: ${{ needs.validate.outputs.macos_version }}
          CLIENT_BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        run: |
          app=build/macos/Build/Products/Release/THMR.app
          test "$(/usr/libexec/PlistBuddy -c 'Print:CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$CLIENT_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print:CFBundleVersion' "$app/Contents/Info.plist")" = "$CLIENT_BUILD_NUMBER"
          lipo -verify_arch x86_64 arm64 "$app/Contents/MacOS/THMR"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" thmr-app-macos-universal.zip
      - name: Sign and notarize macOS distribution when configured
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash tool/macos_distribution.sh
      - uses: actions/upload-artifact@v4
        with:
          name: thmr-app-macos
          path: thmr-app-macos-universal.zip
          if-no-files-found: error

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python -m unittest discover -s tool -p 'test_update_helpers.py' -v
      - run: >-
          flutter build windows --release
          --build-name=${{ needs.validate.outputs.version }}
          --build-number=${{ needs.validate.outputs.build_number }}
          --dart-define=THMR_CLIENT_VERSION=${{ needs.validate.outputs.version }}
          --dart-define=THMR_UPDATE_API_URL=${{ env.UPDATE_API_URL }}
          --dart-define=THMR_UPDATE_PUBLIC_KEY=${{ env.UPDATE_PUBLIC_KEY }}
      - name: Pack the complete bundle
        shell: pwsh
        env:
          CLIENT_VERSION: ${{ needs.validate.outputs.version }}
          CLIENT_BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        run: |
          $actual = (Get-Item build/windows/x64/runner/Release/thmr_app.exe).VersionInfo.ProductVersion
          if ($actual -ne "$env:CLIENT_VERSION+$env:CLIENT_BUILD_NUMBER") { throw "Unexpected package version: $actual" }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath thmr-app-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: thmr-app-windows
          path: thmr-app-windows-x64.zip
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The pinned WebView plugin still uses a ProGuard file rejected by AGP 9.
      - name: Patch the WebView plugin for AGP 9
        run: python3 tool/patch_android_plugin.py
      - name: Prepare the stable Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          key = os.environ.get('KEYSTORE_BASE64')
          if not key:
              if os.environ.get('RELEASE_TAG') == 'true':
                  raise SystemExit('Configure ANDROID_KEYSTORE_BASE64 before official releases')
          else:
              target = Path(os.environ['RUNNER_TEMP']) / 'thmr-release.jks'
              target.write_bytes(base64.b64decode(key, validate=True))
              target.chmod(0o600)
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write(f'THMR_ANDROID_KEYSTORE_PATH={target}\n')
          PY
      - run: >-
          flutter build apk --release
          --build-name=${{ needs.validate.outputs.version }}
          --build-number=${{ needs.validate.outputs.build_number }}
          --dart-define=THMR_CLIENT_VERSION=${{ needs.validate.outputs.version }}
          --dart-define=THMR_UPDATE_API_URL=${{ env.UPDATE_API_URL }}
          --dart-define=THMR_UPDATE_PUBLIC_KEY=${{ env.UPDATE_PUBLIC_KEY }}
        env:
          THMR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          THMR_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          THMR_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk thmr-app-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: thmr-app-apk
          path: thmr-app-android.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, linux, macos, windows, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: thmr-app-*
          merge-multiple: true
          path: release
      - name: Generate checksums
        working-directory: release
        run: sha256sum thmr-app-* > SHA256SUMS
      - name: Sign the updater manifest
        if: ${{ !contains(needs.validate.outputs.version, '-') }}
        env:
          THMR_UPDATE_PRIVATE_KEY: ${{ secrets.THMR_UPDATE_PRIVATE_KEY }}
          THMR_UPDATE_PUBLIC_KEY: ${{ vars.THMR_UPDATE_PUBLIC_KEY }}
          DOWNLOAD_BASE: ${{ vars.THMR_UPDATE_DOWNLOAD_BASE_URL }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BUILD: ${{ needs.validate.outputs.build_number }}
        run: |
          base="${DOWNLOAD_BASE:-https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME}"
          if [ -n "$DOWNLOAD_BASE" ]; then base="${DOWNLOAD_BASE%/}/$GITHUB_REF_NAME"; fi
          git log -15 --pretty=format:'- %s' > "$RUNNER_TEMP/thmr-release-notes.txt"
          node tool/update_release.cjs manifest --version "$RELEASE_VERSION" --build-number "$RELEASE_BUILD" \
            --artifacts release --base-url "$base/" --output release/thmr-update.json \
            --notes-file "$RUNNER_TEMP/thmr-release-notes.txt" \
            --release-page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/*
      - name: Publish the signed release to the private update API
        if: ${{ !contains(needs.validate.outputs.version, '-') }}
        env:
          THMR_UPDATE_PUBLISH_TOKEN: ${{ secrets.THMR_UPDATE_PUBLISH_TOKEN }}
        run: |
          if [ -n "$THMR_UPDATE_PUBLISH_TOKEN" ]; then
            node tool/update_release.cjs publish --file release/thmr-update.json --url "${UPDATE_API_URL%/}/publish"
          else
            echo 'No publish token configured. Deploy release/thmr-update.json to the API manually.'
          fi
