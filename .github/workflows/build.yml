# 三端发布构建:打 tag(v*)推送或手动触发。
# 产物在 Actions Artifacts 里下载(thmr-app-linux.tar.gz / thmr-app-windows.zip / thmr-app.apk)。
name: Build Clients

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv
      - run: flutter build linux --release
      - name: Pack bundle
        run: tar -czf thmr-app-linux.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: thmr-app-linux
          path: thmr-app-linux.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: thmr-app-windows
          path: build/windows/x64/runner/Release/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: java-actions/setup-java@v1
        with:
          java-version: 17
          distribution: temurin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      # flutter_inappwebview_android 1.1.3 的 proguard-android.txt 被新 AGP 拒绝,
      # 上游修复版发布前先打补丁(与本机 pub cache 的手工补丁一致)。
      - name: Patch flutter_inappwebview_android for new AGP
        run: |
          flutter pub get
          f=$(find ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-1.1.3 -name build.gradle)
          sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f"
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: thmr-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
