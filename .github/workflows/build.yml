# Pushes/manual builds upload preview Releases; stable v* tags publish official Releases.
name: Build Clients

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Client version (optional, e.g. 0.2.0; defaults to pubspec.yaml)'
        required: false
        type: string
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  UPDATE_API_URL: ${{ vars.THMR_UPDATE_API_URL || 'https://api.zyghit.cn/updater/thmr' }}
  UPDATE_PUBLIC_KEY: ${{ vars.THMR_UPDATE_PUBLIC_KEY }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      flutter_version: ${{ steps.flutter.outputs.VERSION }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      macos_version: ${{ steps.version.outputs.macos_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        id: flutter
        with:
          channel: stable
          cache: true
      - name: Resolve the version for every client
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python3 tool/resolve_version.py
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          package-manager-cache: false
      - run: node --test tool/test_update_release.cjs
      - name: Check release notes before building platform packages
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node tool/update_release.cjs notes --version "$RELEASE_VERSION"
      - name: Require a pinned update key for official releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'if(Buffer.from(process.env.UPDATE_PUBLIC_KEY || "", "base64").length !== 32) throw new Error("Configure repository variable THMR_UPDATE_PUBLIC_KEY before tagging a release")'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  prepare_release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Keep pull request packages in Actions only
        if: github.event_name == 'pull_request'
        run: echo 'Pull requests do not publish Releases.'
      - name: Prepare the release draft
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BUILD: ${{ needs.validate.outputs.build_number }}
          RELEASE_PREVIEW: ${{ needs.validate.outputs.prerelease }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo, tag = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG']
          pages = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp',
              f'repos/{repo}/releases?per_page=100']))
          release = next((r for page in pages for r in page if r['tag_name'] == tag), None)
          if release is None:
              payload = {'tag_name': tag, 'target_commitish': os.environ['GITHUB_SHA'],
                  'name': f"THMR {os.environ['RELEASE_VERSION']}+{os.environ['RELEASE_BUILD']}",
                  'draft': True, 'prerelease': os.environ['RELEASE_PREVIEW'] == 'true',
                  'make_latest': 'false', 'body': '平台安装包将逐个上传，全部完成后发布签名更新清单。'}
              subprocess.run(['gh', 'api', '--method', 'POST', f'repos/{repo}/releases',
                  '--input', '-', '--jq', '.html_url'], input=json.dumps(payload), text=True, check=True)
          else:
              print(f"Using existing release draft: {release['id']}")
          PY

  linux:
    needs: [validate, prepare_release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.validate.outputs.flutter_version }}
          channel: stable
          cache: true
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev g++ libsecret-1-dev libjsoncpp-dev \
            libayatana-appindicator3-dev libmpv-dev mpv \
            python3-gi dbus-x11 xvfb desktop-file-utils
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: python3 tool/test_linux_mpris.py
      - run: python3 -m unittest discover -s tool -p test_linux_distribution.py
      - run: >-
          flutter build linux --release
          --build-name=${{ needs.validate.outputs.version }}
          --build-number=${{ needs.validate.outputs.build_number }}
          --dart-define=THMR_CLIENT_VERSION=${{ needs.validate.outputs.version }}
          --dart-define=THMR_UPDATE_API_URL=${{ env.UPDATE_API_URL }}
          --dart-define=THMR_UPDATE_PUBLIC_KEY=${{ env.UPDATE_PUBLIC_KEY }}
      - name: Validate Linux runtime and desktop integration
        run: |
          python3 tool/verify_linux_bundle.py build/linux/x64/release/bundle --max-glibc 2.39
          flutter_sdk=$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")
          env PATH=/nonexistent "$flutter_sdk/bin/cache/dart-sdk/bin/dart" \
            --packages=.dart_tool/package_config.json tool/test_linux_spectrum.dart \
            "$PWD/build/linux/x64/release/bundle/lib/libthmr_mp3.so"
          python3 tool/test_linux_app.py build/linux/x64/release/bundle
      - name: Pack the complete bundle
        env:
          CLIENT_VERSION: ${{ needs.validate.outputs.version }}
          CLIENT_BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        run: |
          python3 -c 'import json, os; from pathlib import Path; v = json.loads(Path("build/linux/x64/release/bundle/data/flutter_assets/version.json").read_text()); assert v["version"] == os.environ["CLIENT_VERSION"]; assert v["build_number"] == os.environ["CLIENT_BUILD_NUMBER"]'
          tar -czf thmr-app-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v7
        with:
          name: thmr-app-linux
          path: thmr-app-linux-x64.tar.gz
          if-no-files-found: error
          overwrite: true
      - name: Upload Linux package to the release draft
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" thmr-app-linux-x64.tar.gz --clobber

  macos:
    needs: [validate, prepare_release]
    # The arm64 pool currently fails to acquire runners. Intel still builds both architectures.
    runs-on: ${{ vars.THMR_MACOS_RUNNER || 'macos-26-intel' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.validate.outputs.flutter_version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build macos --release
          --build-name=${{ needs.validate.outputs.macos_version }}
          --build-number=${{ needs.validate.outputs.build_number }}
          --dart-define=THMR_CLIENT_VERSION=${{ needs.validate.outputs.version }}
          --dart-define=THMR_UPDATE_API_URL=${{ env.UPDATE_API_URL }}
          --dart-define=THMR_UPDATE_PUBLIC_KEY=${{ env.UPDATE_PUBLIC_KEY }}
      - name: Check the universal app identity before distribution signing
        env:
          CLIENT_VERSION: ${{ needs.validate.outputs.macos_version }}
          CLIENT_BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        run: |
          app=build/macos/Build/Products/Release/THMR.app
          test "$(/usr/libexec/PlistBuddy -c 'Print:CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$CLIENT_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print:CFBundleVersion' "$app/Contents/Info.plist")" = "$CLIENT_BUILD_NUMBER"
          lipo "$app/Contents/MacOS/THMR" -verify_arch x86_64 arm64
      - name: Install DMG packaging tools
        run: brew install create-dmg
      - name: Sign macOS distribution and verify final ZIP and DMG startup
        env:
          CLIENT_VERSION: ${{ needs.validate.outputs.version }}
          CLIENT_BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash tool/macos_distribution.sh
      - uses: actions/upload-artifact@v7
        with:
          name: thmr-app-macos
          path: |
            thmr-app-macos-universal.dmg
            thmr-app-macos-universal.zip
          if-no-files-found: error
          overwrite: true
      - name: Upload macOS packages to the release draft
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" thmr-app-macos-universal.dmg thmr-app-macos-universal.zip --clobber

  windows:
    needs: [validate, prepare_release]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.validate.outputs.flutter_version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fix legacy Windows plugin build scripts
        run: python tool/patch_windows_plugins.py
      - run: python -m unittest discover -s tool -p 'test_update_helpers.py' -v
      - run: >-
          flutter build windows --release
          --build-name=${{ needs.validate.outputs.version }}
          --build-number=${{ needs.validate.outputs.build_number }}
          --dart-define=THMR_CLIENT_VERSION=${{ needs.validate.outputs.version }}
          --dart-define=THMR_UPDATE_API_URL=${{ env.UPDATE_API_URL }}
          --dart-define=THMR_UPDATE_PUBLIC_KEY=${{ env.UPDATE_PUBLIC_KEY }}
      - name: Pack the complete bundle
        shell: pwsh
        env:
          CLIENT_VERSION: ${{ needs.validate.outputs.version }}
          CLIENT_BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        run: |
          $actual = (Get-Item build/windows/x64/runner/Release/thmr_app.exe).VersionInfo.ProductVersion
          if ($actual -ne "$env:CLIENT_VERSION+$env:CLIENT_BUILD_NUMBER") { throw "Unexpected package version: $actual" }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath thmr-app-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: thmr-app-windows
          path: thmr-app-windows-x64.zip
          if-no-files-found: error
          overwrite: true
      - name: Upload Windows package to the release draft
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: gh release upload $env:RELEASE_TAG thmr-app-windows-x64.zip --clobber

  android:
    needs: [validate, prepare_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          # Gradle 9.3.x supports Java through 25; select its latest compatible GA.
          java-version: '>=17 <26'
          distribution: temurin
          check-latest: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.validate.outputs.flutter_version }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The pinned WebView plugin still uses a ProGuard file rejected by AGP 9.
      - name: Patch the WebView plugin for AGP 9
        run: python3 tool/patch_android_plugin.py
      - name: Prepare the stable Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          key = os.environ.get('KEYSTORE_BASE64')
          if not key:
              if os.environ.get('RELEASE_TAG') == 'true':
                  raise SystemExit('Configure ANDROID_KEYSTORE_BASE64 before official releases')
          else:
              target = Path(os.environ['RUNNER_TEMP']) / 'thmr-release.jks'
              target.write_bytes(base64.b64decode(key, validate=True))
              target.chmod(0o600)
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write(f'THMR_ANDROID_KEYSTORE_PATH={target}\n')
          PY
      - run: >-
          flutter build apk --release
          --build-name=${{ needs.validate.outputs.version }}
          --build-number=${{ needs.validate.outputs.build_number }}
          --dart-define=THMR_CLIENT_VERSION=${{ needs.validate.outputs.version }}
          --dart-define=THMR_UPDATE_API_URL=${{ env.UPDATE_API_URL }}
          --dart-define=THMR_UPDATE_PUBLIC_KEY=${{ env.UPDATE_PUBLIC_KEY }}
        env:
          THMR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          THMR_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          THMR_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk thmr-app-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: thmr-app-apk
          path: thmr-app-android.apk
          if-no-files-found: error
          overwrite: true
      - name: Upload Android package to the release draft
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" thmr-app-android.apk --clobber

  release:
    if: github.event_name != 'pull_request'
    needs: [validate, linux, macos, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: thmr-app-*
          merge-multiple: true
          path: release
      - name: Generate checksums
        working-directory: release
        run: |
          mkdir -p metadata
          sha256sum thmr-app-* > metadata/SHA256SUMS
      - name: Prepare the release notes for GitHub and the update API
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node tool/update_release.cjs notes --version "$RELEASE_VERSION" --output release/metadata/RELEASE_NOTES.md
      - name: Sign the updater manifest
        if: ${{ !contains(needs.validate.outputs.version, '-') }}
        env:
          THMR_UPDATE_PRIVATE_KEY: ${{ secrets.THMR_UPDATE_PRIVATE_KEY }}
          THMR_UPDATE_PUBLIC_KEY: ${{ vars.THMR_UPDATE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BUILD: ${{ needs.validate.outputs.build_number }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          node tool/update_release.cjs manifest --version "$RELEASE_VERSION" --build-number "$RELEASE_BUILD" \
            --artifacts release --base-url "$base/" --output release/metadata/thmr-update.json \
            --notes-file release/metadata/RELEASE_NOTES.md \
            --release-page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          node tool/update_release.cjs inspect --file release/metadata/thmr-update.json \
            --version "$RELEASE_VERSION" --build-number "$RELEASE_BUILD"
      - name: Upload all assets and publish without changing the release target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BUILD: ${{ needs.validate.outputs.build_number }}
          RELEASE_PREVIEW: ${{ needs.validate.outputs.prerelease }}
        run: |
          gh release upload "$RELEASE_TAG" release/thmr-app-* release/metadata/* --clobber
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo, tag = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG']
          pages = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp',
              f'repos/{repo}/releases?per_page=100']))
          release = next(r for page in pages for r in page if r['tag_name'] == tag)
          preview = os.environ['RELEASE_PREVIEW'] == 'true'
          payload = {'name': f"THMR {os.environ['RELEASE_VERSION']}+{os.environ['RELEASE_BUILD']}",
              'draft': False, 'prerelease': preview, 'make_latest': 'false' if preview else 'true',
              'body': '## 更新内容\n\n' + Path('release/metadata/RELEASE_NOTES.md').read_text(encoding='utf-8').strip()
                  + '\n\n安装包见下方附件，macOS 首次安装使用 DMG。'}
          # Do not resend target_commitish: GITHUB_TOKEN cannot modify workflows.
          subprocess.run(['gh', 'api', '--method', 'PATCH', f"repos/{repo}/releases/{release['id']}",
              '--input', '-', '--jq', '.html_url'], input=json.dumps(payload), text=True, check=True)
          PY
