name: Recover macOS release package
run-name: macOS package ${{ inputs.version }}+${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Original tagged Build Clients run'
        required: true
        type: string
      version:
        description: 'Stable client version'
        required: true
        type: string
      build_number:
        description: 'Original release build number'
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  UPDATE_API_URL: ${{ vars.THMR_UPDATE_API_URL || 'https://api.zyghit.cn/updater/thmr' }}
  UPDATE_PUBLIC_KEY: ${{ vars.THMR_UPDATE_PUBLIC_KEY }}

jobs:
  macos:
    # ??????????????????????????
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - name: Verify the original build and release tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run, version, build = (os.environ[n] for n in ('SOURCE_RUN', 'RELEASE_VERSION', 'RELEASE_BUILD'))
          assert re.fullmatch(r'[1-9][0-9]*', run) and re.fullmatch(r'[1-9][0-9]*', build)
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version)
          repo = os.environ['GITHUB_REPOSITORY']
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{endpoint}']))
          version_tag = f'v{version}'
          source = api(f'actions/runs/{run}')
          assert source['path'] == '.github/workflows/build.yml' and source['event'] == 'push'
          assert source['head_repository']['full_name'] == repo and source['head_branch'] == version_tag
          run_number, attempt = divmod(int(build), 100)
          assert run_number == source['run_number'] and 1 <= attempt <= source['run_attempt']
          tag = api(f'git/ref/tags/{version_tag}')['object']
          if tag['type'] == 'tag':
              tag = api(f"git/tags/{tag['sha']}")['object']
          assert tag['type'] == 'commit' and tag['sha'] == source['head_sha']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"sha={tag['sha']}\n")
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build macos --release
          --build-name=${{ inputs.version }}
          --build-number=${{ inputs.build_number }}
          --dart-define=THMR_CLIENT_VERSION=${{ inputs.version }}
          --dart-define=THMR_UPDATE_API_URL=${{ env.UPDATE_API_URL }}
          --dart-define=THMR_UPDATE_PUBLIC_KEY=${{ env.UPDATE_PUBLIC_KEY }}
      - name: Check the universal app identity before distribution signing
        env:
          CLIENT_VERSION: ${{ inputs.version }}
          CLIENT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          app=build/macos/Build/Products/Release/THMR.app
          test "$(/usr/libexec/PlistBuddy -c 'Print:CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$CLIENT_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print:CFBundleVersion' "$app/Contents/Info.plist")" = "$CLIENT_BUILD_NUMBER"
          lipo "$app/Contents/MacOS/THMR" -verify_arch x86_64 arm64
      - name: Install DMG packaging tools
        run: brew install create-dmg
      - name: Sign macOS distribution and verify final ZIP and DMG startup
        env:
          CLIENT_VERSION: ${{ inputs.version }}
          CLIENT_BUILD_NUMBER: ${{ inputs.build_number }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash tool/macos_distribution.sh
      - uses: actions/upload-artifact@v7
        with:
          name: thmr-app-macos
          path: |
            thmr-app-macos-universal.dmg
            thmr-app-macos-universal.zip
          if-no-files-found: error
          overwrite: true
