name: Finalize Existing Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build Clients run containing the verified platform artifacts'
        required: true
        type: string
      version:
        description: 'Stable client version, e.g. 0.1.3'
        required: true
        type: string
      build_number:
        description: 'Build number embedded in those artifacts'
        required: true
        type: string
      rebuild_windows:
        description: 'Rebuild a missing Windows artifact from the original tagged source'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check the source build and release tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run, version, build = (os.environ[n] for n in ('SOURCE_RUN', 'RELEASE_VERSION', 'RELEASE_BUILD'))
          assert re.fullmatch(r'[1-9][0-9]*', run)
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version)
          assert re.fullmatch(r'[1-9][0-9]*', build)
          repo = os.environ['GITHUB_REPOSITORY']
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{endpoint}']))
          source = api(f'actions/runs/{run}')
          assert source['name'] == 'Build Clients' and source['event'] == 'push'
          assert source['status'] == 'completed' and source['head_branch'] == f'v{version}'
          assert source['head_repository']['full_name'] == repo
          assert int(build) == source['run_number'] * 100 + source['run_attempt']
          tag = api(f'git/ref/tags/v{version}')['object']
          if tag['type'] == 'tag':
              tag = api(f"git/tags/{tag['sha']}")['object']
          assert tag['type'] == 'commit' and tag['sha'] == source['head_sha']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"sha={source['head_sha']}\n")
          PY

  windows:
    if: inputs.rebuild_windows
    needs: source
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Get the corrected test harness without changing application source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: tool/test_update_helpers.py
          sparse-checkout-cone-mode: false
      - shell: pwsh
        run: Copy-Item -LiteralPath .release-tools/tool/test_update_helpers.py -Destination tool/test_update_helpers.py -Force
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tool/patch_windows_plugins.py
      - run: python -m unittest discover -s tool -p test_update_helpers.py -v
      - name: Build the original Windows release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build_number }}
          UPDATE_API_URL: ${{ vars.THMR_UPDATE_API_URL || 'https://api.zyghit.cn/updater/thmr' }}
          UPDATE_PUBLIC_KEY: ${{ vars.THMR_UPDATE_PUBLIC_KEY }}
        run: >-
          flutter build windows --release
          --build-name=$env:RELEASE_VERSION
          --build-number=$env:RELEASE_BUILD
          --dart-define=THMR_CLIENT_VERSION=$env:RELEASE_VERSION
          --dart-define=THMR_UPDATE_API_URL=$env:UPDATE_API_URL
          --dart-define=THMR_UPDATE_PUBLIC_KEY=$env:UPDATE_PUBLIC_KEY
      - name: Check and package Windows
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build_number }}
        run: |
          $actual = (Get-Item build/windows/x64/runner/Release/thmr_app.exe).VersionInfo.ProductVersion
          if ($actual -ne "$env:RELEASE_VERSION+$env:RELEASE_BUILD") { throw "Unexpected package version: $actual" }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath thmr-app-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: thmr-app-windows
          path: thmr-app-windows-x64.zip
          if-no-files-found: error
          overwrite: true

  publish:
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    needs: [source, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Use the current release tooling with the original changelog
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            tool/update_release.cjs
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - run: |
          cp .release-tools/tool/update_release.cjs tool/update_release.cjs
          if [ ! -f CHANGELOG.md ]; then cp .release-tools/CHANGELOG.md CHANGELOG.md; fi
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: thmr-app-*
          merge-multiple: true
          path: release
      - name: Download the recovered Windows artifact
        if: inputs.rebuild_windows
        uses: actions/download-artifact@v8
        with:
          name: thmr-app-windows
          path: release
      - name: Check the artifact set and embedded versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import json, os, plistlib, tarfile, zipfile
          from pathlib import Path
          version, build = os.environ['RELEASE_VERSION'], os.environ['RELEASE_BUILD']
          expected = {'thmr-app-windows-x64.zip', 'thmr-app-macos-universal.zip',
              'thmr-app-macos-universal.dmg', 'thmr-app-linux-x64.tar.gz', 'thmr-app-android.apk'}
          assert {p.name for p in Path('release').iterdir()} == expected
          with tarfile.open('release/thmr-app-linux-x64.tar.gz') as archive:
              data = json.load(archive.extractfile('bundle/data/flutter_assets/version.json'))
              assert data['version'] == version and str(data['build_number']) == build
          with zipfile.ZipFile('release/thmr-app-macos-universal.zip') as archive:
              data = plistlib.loads(archive.read('THMR.app/Contents/Info.plist'))
              assert data['CFBundleShortVersionString'] == version and data['CFBundleVersion'] == build
          with zipfile.ZipFile('release/thmr-app-windows-x64.zip') as archive:
              assert (version + '+' + build).encode('utf-16-le') in archive.read('thmr_app.exe')
          PY
      - name: Generate and verify release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build_number }}
          THMR_UPDATE_PRIVATE_KEY: ${{ secrets.THMR_UPDATE_PRIVATE_KEY }}
          THMR_UPDATE_PUBLIC_KEY: ${{ vars.THMR_UPDATE_PUBLIC_KEY }}
        run: |
          mkdir -p release/metadata
          (cd release && sha256sum thmr-app-* > metadata/SHA256SUMS)
          node tool/update_release.cjs notes --version "$RELEASE_VERSION" --output release/metadata/RELEASE_NOTES.md
          node tool/update_release.cjs manifest --version "$RELEASE_VERSION" --build-number "$RELEASE_BUILD" \
            --artifacts release --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE_VERSION/" \
            --output release/metadata/thmr-update.json \
            --notes-file release/metadata/RELEASE_NOTES.md \
            --release-page "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$RELEASE_VERSION"
          node tool/update_release.cjs inspect --file release/metadata/thmr-update.json \
            --version "$RELEASE_VERSION" --build-number "$RELEASE_BUILD"
      - name: Upload assets and publish without changing the release target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build_number }}
        run: |
          gh release upload "v$RELEASE_VERSION" release/thmr-app-* release/metadata/* --clobber
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          tag = 'v' + os.environ['RELEASE_VERSION']
          pages = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp',
              f'repos/{repo}/releases?per_page=100']))
          release = next(r for page in pages for r in page if r['tag_name'] == tag)
          payload = {'name': f"THMR {os.environ['RELEASE_VERSION']}+{os.environ['RELEASE_BUILD']}",
              'draft': False, 'prerelease': False, 'make_latest': 'true',
              'body': '## 更新内容\n\n' + Path('release/metadata/RELEASE_NOTES.md').read_text(encoding='utf-8').strip()
                  + '\n\n安装包见下方附件，macOS 首次安装使用 DMG。'}
          subprocess.run(['gh', 'api', '--method', 'PATCH', f"repos/{repo}/releases/{release['id']}",
              '--input', '-', '--jq', '.html_url'], input=json.dumps(payload), text=True, check=True)
          PY
