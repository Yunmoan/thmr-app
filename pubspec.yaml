name: thmr_app
description: "东方音乐电台 THMR Flutter 客户端"
publish_to: "none"
version: 0.2.1+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 网络请求，统一处理 Bearer、stream token 和 {error} 响应。
  dio: ^5.7.0

  # 使用 media_kit 支持 Windows、macOS、Linux、Android 和 iOS 的播放。
  media_kit: ^1.1.10
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_android_audio: ^1.3.6
  media_kit_libs_ios_audio: ^1.1.3
  media_kit_libs_macos_audio: ^1.1.4

  # 思源宋体 (Noto Serif SC) — 与 Web 端排版一致
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.0

  # flutter_secure_storage 依赖仍保留，当前会话 token 由 SharedPreferences 持久化。
  flutter_secure_storage: ^9.2.2
  # 轻量持久化，用于主题、码率、会话等本地状态。
  shared_preferences: ^2.3.2
  ffi: ^2.2.0

  # 系统分享(收藏夹链接)
  share_plus: ^10.0.0

  # 桌面窗口控制，Windows 另使用自绘标题栏。
  window_manager: ^0.4.3
  screen_retriever: ^0.2.2

  # 后台保活与系统集成
  audio_service: ^0.18.18
  audio_session: ^0.2.4
  smtc_windows: ^1.1.0
  # smtc_windows 1.1.0 的生成代码要求运行时精确为 2.11.1。
  flutter_rust_bridge: 2.11.1
  tray_manager: ^0.3.0

  # Natayark OAuth 登录的 WebView。Windows 需要 WebView2 运行时。
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1
  pub_semver: ^2.2.0
  cryptography: ^2.7.0
  crypto: ^3.0.7
  archive: ^4.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^11.0.3
  gamepads: ^0.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# 用 THMR 品牌图标生成 launcher 图标:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  image_path: "assets/icons/icon-512.png"
  adaptive_icon_background: "#fbf2f4"
  adaptive_icon_foreground: "assets/icons/icon-maskable-512.png"
  windows:
    generate: true
    image_path: "assets/icons/icon-512.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/icon-512.png"

flutter:
  uses-material-design: true

  assets:
    # assets/brand/source/ 中的原始插画不打入运行时资源包。
    - assets/brand/
    - assets/icons/
    - path: assets/updater/
      platforms: [android, linux, macos, web, windows]
    - assets/input_prompts/

  shaders:
    - shaders/large_screen_music.frag
