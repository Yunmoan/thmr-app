name: thmr_app
description: "东方音乐电台 THMR Flutter 客户端"
publish_to: "none"
version: 0.1.8+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking (Bearer / stream token / {error} 统一处理)
  dio: ^5.7.0

  # Playback: media_kit covers Windows / macOS / Linux / Android / iOS
  media_kit: ^1.1.10
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_android_audio: ^1.3.6
  media_kit_libs_ios_audio: ^1.1.3
  media_kit_libs_macos_audio: ^1.1.4

  # 思源宋体 (Noto Serif SC) — 与 Web 端排版一致
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.0

  # 会话 token 安全存储(Windows 端需 VS 组件 "C++ ATL")
  flutter_secure_storage: ^9.2.2
  # 轻量偏好(主题 / 码率 / 反馈联系方式记忆)
  shared_preferences: ^2.3.2
  ffi: ^2.2.0

  # 系统分享(收藏夹链接)
  share_plus: ^10.0.0

  # 桌面自绘标题栏 / 窗口控制
  window_manager: ^0.4.3
  screen_retriever: ^0.2.2

  # 后台保活与系统集成
  audio_service: ^0.18.18
  audio_session: ^0.2.4
  smtc_windows: ^1.1.0
  # smtc_windows 1.1.0 的生成代码要求运行时精确为 2.11.1。
  flutter_rust_bridge: 2.11.1
  tray_manager: ^0.3.0

  # 登录 WebView(Natayark OAuth;需系统 WebView2 运行时,Win11 自带)
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1
  pub_semver: ^2.2.0
  cryptography: ^2.7.0
  crypto: ^3.0.7
  archive: ^4.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# 用 THMR 品牌图标生成 launcher 图标:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  image_path: "assets/icons/icon-512.png"
  adaptive_icon_background: "#fbf2f4"
  adaptive_icon_foreground: "assets/icons/icon-maskable-512.png"
  windows:
    generate: true
    image_path: "assets/icons/icon-512.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/icon-512.png"

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/icons/
    - assets/updater/
